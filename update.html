<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3eb">
  <title>Update CS Study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px; background: #f4f3eb; color: #23261f; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 440px; padding: 28px; background: #fffef8; border: 2px solid #30332a; border-radius: 4px; box-shadow: 5px 5px 0 #30332a; }
    h1 { margin: 0 0 14px; font-size: 30px; line-height: 1.2; letter-spacing: -.04em; }
    p { color: #62665a; }
    .mark { display: inline-block; margin-bottom: 24px; padding: 4px 10px; border: 2px solid #30332a; background: #d5f968; font: 800 24px/1.3 ui-monospace, monospace; }
    a { display: inline-flex; align-items: center; min-height: 44px; color: #354b17; font-weight: 650; text-underline-offset: 3px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">cs.</span>
    <h1>Updating CS Study.</h1>
    <p id="status" role="status">Downloading the latest version. This can take a moment.</p>
    <p>Your lessons, answers, and bookmarks stay saved.</p>
    <a href="update.html" id="retry" hidden>Try again</a>
    <noscript><p>Enable JavaScript to update the app.</p><a href="./">Open CS Study</a></noscript>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    const retry = document.querySelector('#retry');
    const activated = (worker) => new Promise((resolve, reject) => {
      if (!worker) return reject(new Error('The update is not available yet.'));
      if (worker.state === 'activated') return resolve();
      const timer = setTimeout(() => finish(new Error('The download took too long.')), 60000);
      const finish = (error) => {
        clearTimeout(timer);
        worker.removeEventListener('statechange', changed);
        error ? reject(error) : resolve();
      };
      const changed = () => {
        if (worker.state === 'activated') finish();
        if (worker.state === 'redundant') finish(new Error('The download could not finish.'));
      };
      worker.addEventListener('statechange', changed);
      changed();
    });
    const versionOf = (worker) => new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      const timer = setTimeout(() => {
        channel.port1.close();
        reject(new Error('The latest version is not ready yet.'));
      }, 5000);
      channel.port1.onmessage = (event) => {
        clearTimeout(timer);
        channel.port1.close();
        resolve(event.data);
      };
      worker.postMessage('APP_VERSION', [channel.port2]);
    });
    try {
      if (!navigator.onLine) throw new Error('Connect to the internet to update.');
      if (!('serviceWorker' in navigator)) {
        location.replace('./');
      } else {
        const registration = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
        await registration.update();
        const worker = registration.installing || registration.waiting || registration.active;
        await activated(worker);
        await versionOf(worker);
        location.replace('./');
      }
    } catch (error) {
      status.textContent = `${error.message} Check your connection, then try again.`;
      retry.hidden = false;
    }
  </script>
</body>
</html>
